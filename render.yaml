services:
  - type: web
    name: peopleclock
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MANAGER_SIGNUP_CODE
        sync: false
      - key: RAG_API_URL
        fromService:
          type: web
          name: peopleclock-rag
          envVarKey: RENDER_EXTERNAL_URL
  - type: web
    name: peopleclock-rag
    runtime: python
    plan: free
    rootDir: python-rag
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
